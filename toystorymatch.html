<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Story Caller</title>
    <style>
        /* --- ANDY'S ROOM WALLPAPER --- */
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #87CEEB;
            /* Sky Blue */
            background-image:
                radial-gradient(circle at 50% 50%, white 25%, transparent 26%),
                radial-gradient(circle at 50% 50%, white 25%, transparent 26%);
            background-size: 100px 100px;
            background-position: 0 0, 50px 50px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #193663;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 25px;
            border-radius: 20px;
            border: 3px solid #193663;
            margin-bottom: 20px;
            font-size: 1.8rem;
            box-shadow: 0 6px rgba(0, 0, 0, 0.15);
        }

        /* --- THE CARD DISPLAY --- */
        #card-display {
            width: 300px;
            height: 300px;
            background-color: white;
            border: 10px solid white;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        #card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Keeps the whole image visible */
        }

        /* --- CONTROLS --- */
        #character-name {
            font-size: 2.8rem;
            font-weight: 900;
            color: #E4222D;
            /* Toy Story Red */
            -webkit-text-stroke: 1.5px white;
            /* White outline */
            text-shadow: 3px 3px 0px #193663;
            margin: 5px 0 20px 0;
            min-height: 65px;
            line-height: 1.1;
        }

        button {
            background-color: #FDD023;
            /* Toy Story Yellow */
            border: 5px solid #E4222D;
            /* Red Border */
            color: #E4222D;
            padding: 20px 60px;
            font-size: 26px;
            font-weight: 900;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px #bf1c25;
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 4px #bf1c25;
        }

        /* Cards Left Counter */
        #status-bar {
            margin-top: 20px;
            font-size: 1.2rem;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 0 #193663;
            background: #193663;
            padding: 5px 15px;
            border-radius: 15px;
        }

        /* --- WELCOME SCREEN --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(135, 206, 235, 0.95);
            /* Opaque Sky Blue */
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <!-- Welcome Screen Overlay -->
    <div id="welcome-screen">
        <h1 style="font-size: 3rem; margin-bottom: 20px;">Who is playing?</h1>

        <input type="text" id="child-name-input" placeholder="Enter child's name"
            style="font-size: 1.5rem; padding: 10px; border-radius: 10px; border: 2px solid #193663; margin-bottom: 30px; text-align: center; width: 300px;">

        <div style="display: flex; gap: 40px; margin-bottom: 30px;">
            <!-- Mommy Section -->
            <div style="display: flex; flex-direction: column; align-items: center;">
                <button class="voice-btn" style="background-color: #FF69B4; border-color: #C71585;"
                    onclick="startGame('female')">Mommy</button>
                <label for="mommy-voice" style="margin-top: 10px; font-weight: bold; color: #193663;">Voice:</label>
                <select id="mommy-voice" style="padding: 5px; border-radius: 5px; max-width: 200px;"></select>
            </div>

            <!-- Daddy Section -->
            <div style="display: flex; flex-direction: column; align-items: center;">
                <button class="voice-btn" style="background-color: #4169E1; border-color: #00008B;"
                    onclick="startGame('male')">Daddy</button>
                <label for="daddy-voice" style="margin-top: 10px; font-weight: bold; color: #193663;">Voice:</label>
                <select id="daddy-voice" style="padding: 5px; border-radius: 5px; max-width: 200px;"></select>
            </div>
        </div>
    </div>

    <!-- Game Content (Initially Hidden opacity, but we can just layer the welcome screen on top) -->
    <h1>Toy Story Memory</h1>

    <div id="card-display">
        <img id="card-img" src="https://via.placeholder.com/300x300/FDD023/E4222D?text=Ready+to+Play!" alt="Character">
    </div>

    <div id="character-name">Hi Friend!</div>

    <div id="controls-container" style="display: flex; gap: 20px;">
        <button id="action-btn" onclick="nextCard()">PICK CARD</button>
        <button id="match-btn" style="background-color: #4CAF50; border-color: #006400;" onclick="askMatch()">Find
            Match</button>
    </div>

    <div id="status-bar">Cards in Deck: <span id="count">16</span></div>

    <script>
        // --- YOUR CHARACTER LIST ---
        const initialDeck = [
            { name: "Woody", img: "images/characters/woody.jfif" },
            { name: "Buzz Lightyear", img: "images/characters/buzzlightyear.jfif" },
            { name: "Jessie", img: "images/characters/jessie.jfif" },
            { name: "Slinky Dog", img: "images/characters/slinkydog.jfif" },
            { name: "Hamm", img: "images/characters/hamm.jfif" },
            { name: "Bo Peep", img: "images/characters/bopeep.jfif" },
            { name: "Forky", img: "images/characters/forky.jfif" },
            { name: "Rex", img: "images/characters/rex.jfif" },
            { name: "Bullseye", img: "images/characters/bullseye.jfif" },
            { name: "Dolly", img: "images/characters/dolly.jfif" },
            { name: "Mr. Pricklepants", img: "images/characters/mrpricklepants.jfif" },
            { name: "Trixie", img: "images/characters/trixie.jfif" },
            { name: "Buttercup", img: "images/characters/buttercup.jfif" },
            { name: "Gabby Gabby", img: "images/characters/gabbygabby.jfif" },
            { name: "Duke Caboom", img: "images/characters/dukecaboom.jfif" },
            { name: "Aliens", img: "images/characters/aliens.jfif" }
        ];

        let currentDeck = [];
        let selectedVoice = null;
        let voiceGender = 'female'; // Default
        let childName = 'Friend';
        let currentCardName = "";

        function resetDeck() {
            currentDeck = [...initialDeck];
            updateCount();
        }

        function populateVoiceList() {
            if (typeof speechSynthesis === 'undefined') {
                return;
            }

            const voices = speechSynthesis.getVoices();
            const mommySelect = document.getElementById('mommy-voice');
            const daddySelect = document.getElementById('daddy-voice');

            mommySelect.innerHTML = '';
            daddySelect.innerHTML = '';

            // Filter voices by browser language
            const browserLang = navigator.language || 'en-US';
            const navLangShort = browserLang.split('-')[0]; // e.g., "en" from "en-US"

            const filteredVoices = voices.filter(voice => {
                // Check exact match or base language match (e.g. "en-US" matches "en-GB" if we just check "en"?)
                // Usually better to check if voice.lang starts with the header or vice versa.
                // Let's be inclusive: match if they share the base language (e.g. "en")
                return voice.lang.startsWith(navLangShort);
            });

            // If no voices match (unlikely/fallback), show all
            const voicesToShow = filteredVoices.length > 0 ? filteredVoices : voices;

            voicesToShow.forEach((voice) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.value = voice.name;

                // Clone for both dropdowns
                mommySelect.appendChild(option.cloneNode(true));
                daddySelect.appendChild(option);
            });

            // Smart Defaults (scoped to filtered list)
            const femaleDefault = voicesToShow.find(v => v.name.includes('Zira') || v.name.includes('Female') || v.name.includes('Google US English'));
            const maleDefault = voicesToShow.find(v => v.name.includes('David') || v.name.includes('Male') || v.name.includes('Mark'));

            if (femaleDefault) {
                mommySelect.value = femaleDefault.name;
            }
            if (maleDefault) {
                daddySelect.value = maleDefault.name;
            }
        }

        function startGame(gender) {
            voiceGender = gender;
            const voices = window.speechSynthesis.getVoices();

            // Get Child Name
            const nameInput = document.getElementById('child-name-input').value;
            if (nameInput && nameInput.trim() !== "") {
                childName = nameInput.trim();
            }

            // Update on-screen greeting
            document.getElementById("character-name").innerText = "Hi " + childName + "!";

            // Get selected voice name from the dropdown
            let selectedName;
            if (gender === 'female') {
                selectedName = document.getElementById('mommy-voice').value;
            } else {
                selectedName = document.getElementById('daddy-voice').value;
            }

            // Find the actual voice object
            selectedVoice = voices.find(v => v.name === selectedName);

            if (!selectedVoice && voices.length > 0) {
                selectedVoice = voices[0]; // Fallback
            }

            console.log("Selected voice:", selectedVoice ? selectedVoice.name : "Default");

            // Hide welcome screen
            document.getElementById('welcome-screen').style.display = 'none';

            // Initialize game
            resetDeck();

            // Speak friendly greeting
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("Let's play!");
                if (selectedVoice) utterance.voice = selectedVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Initialize voices
        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        function nextCard() {
            const btn = document.getElementById("action-btn");

            // Game Over Check
            if (currentDeck.length === 0) {
                document.getElementById("character-name").innerText = "All Done!";
                document.getElementById("card-img").src = "https://via.placeholder.com/300/87CEEB/FFFFFF?text=Good+Job!";
                speakName("All done! Good job!");
                btn.innerText = "SHUFFLE";
                resetDeck();
                return;
            }

            btn.innerText = "NEXT";

            // 1. Random Pick
            const randomIndex = Math.floor(Math.random() * currentDeck.length);
            const selected = currentDeck[randomIndex];

            // 2. Remove from deck (No Repeats!)
            currentDeck.splice(randomIndex, 1);

            // Set current card name for Find Match button
            currentCardName = selected.name;

            // 3. Update Screen
            document.getElementById("card-img").src = selected.img;
            document.getElementById("character-name").innerText = selected.name;
            updateCount();

            // 4. Speak
            speakName(selected.name);
        }

        function askMatch() {
            if (!currentCardName) return;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("Can you find another picture of " + currentCardName + "?");

                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }

                utterance.pitch = 1.2;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateCount() {
            document.getElementById("count").innerText = currentDeck.length;
        }

        function speakName(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop previous talking

                let message;
                if (text.includes("All done")) {
                    message = text;
                } else {
                    message = childName + ", Where's the picture of " + text + "?";
                }

                const utterance = new SpeechSynthesisUtterance(message);

                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }

                utterance.pitch = 1.2;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>

</html>
